name: Build and Java style
on: [push, pull_request]
jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - shell: pwsh
        run: ./scripts/Format-Java.ps1 -Check
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '21', '25']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B -ntp package
      - run: java -jar target/react-fuscator.jar --version
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest' && matrix.java == '25'
        with:
          name: React-Fuscator
          path: target/react-fuscator.jar
